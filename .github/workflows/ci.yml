name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          GEMINI_API_KEY: test-api-key-for-mocks
          JWT_TEACHER_PASSWORD: teacher_password_jwt
          JWT_STUDENT_PASSWORD: student_password_jwt
        run: npm test

      - name: Run test coverage
        working-directory: ./backend
        env:
          NODE_ENV: test
          GEMINI_API_KEY: test-api-key-for-mocks
          JWT_TEACHER_PASSWORD: teacher_password_jwt
          JWT_STUDENT_PASSWORD: student_password_jwt
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 7

  # ── Frontend Lint & Build ──────────────────────────────────────────────────
  build-frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/quizGenerator/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend/quizGenerator
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend/quizGenerator
        run: npm run lint

      - name: Build frontend (Vite)
        working-directory: ./frontend/quizGenerator
        run: npm run build

  # ── Security Audit ─────────────────────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Audit backend dependencies
        working-directory: ./backend
        # Remove continue-on-error to make high-severity vulns block CI
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Audit frontend dependencies
        working-directory: ./frontend/quizGenerator
        # Remove continue-on-error to make high-severity vulns block CI
        run: npm audit --audit-level=high
        continue-on-error: true

  # ── Docker Build Check ─────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: false
          tags: quizforge:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
