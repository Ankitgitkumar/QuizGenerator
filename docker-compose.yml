version: "3.9"

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: dockerfile
    container_name: quizforge_backend
    ports:
      - "3141:3141"
    environment:
      NODE_ENV: production
      PORT: 3141
      MONGODB_URI: ${MONGODB_URI}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      JWT_TEACHER_PASSWORD: ${JWT_TEACHER_PASSWORD}
      JWT_STUDENT_PASSWORD: ${JWT_STUDENT_PASSWORD}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-quiz-knowledge}
      # Redis connection — points to the redis service defined below
      REDIS_URL: redis://redis:6379
      # Restrict CORS to your deployed frontend URL
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quizforge_net

  # ── Redis (Cache + future BullMQ queue) ─────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: quizforge_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - quizforge_net

  # ── MongoDB (local dev only — use Atlas URI in production) ───────────────────
  mongo:
    image: mongo:7
    container_name: quizforge_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: quizforge
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - quizforge_net
    profiles:
      # Only start local MongoDB when explicitly requested:
      # docker compose --profile local-db up
      - local-db

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
  mongo_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  quizforge_net:
    driver: bridge
